<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 384" width="880" height="384" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="People, AI agents, scripts and CI jobs use one nexus-cli command tree, which applies profiles, the secret store, a permission gate, transfer limits and error scrubbing before calling the Nexus Repository REST API"><rect width="880" height="384" rx="10" fill="#1a1a19"/><rect x="16" y="67" width="190" height="64" rx="8" fill="#242423" stroke="#3a3a37"/><text x="111" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#f0efec">People</text><text x="111" y="114" text-anchor="middle" font-size="12" fill="#c3c2b7">readable tables and records</text><path d="M206 99 C241 99 241 192 269 192" fill="none" stroke="#c3c2b7" stroke-width="1.5"/><path d="M276 192 l-8 -4.5 v9 z" fill="#c3c2b7"/><rect x="16" y="160" width="190" height="64" rx="8" fill="#242423" stroke="#3a3a37"/><text x="111" y="189" text-anchor="middle" font-size="14" font-weight="600" fill="#f0efec">AI agents and scripts</text><text x="111" y="207" text-anchor="middle" font-size="12" fill="#c3c2b7">--json  ·  --json-rpc</text><path d="M206 192 C241 192 241 192 269 192" fill="none" stroke="#c3c2b7" stroke-width="1.5"/><path d="M276 192 l-8 -4.5 v9 z" fill="#c3c2b7"/><rect x="16" y="253" width="190" height="64" rx="8" fill="#242423" stroke="#3a3a37"/><text x="111" y="282" text-anchor="middle" font-size="14" font-weight="600" fill="#f0efec">CI jobs</text><text x="111" y="300" text-anchor="middle" font-size="12" fill="#c3c2b7">credentials on stdin</text><path d="M206 285 C241 285 241 192 269 192" fill="none" stroke="#c3c2b7" stroke-width="1.5"/><path d="M276 192 l-8 -4.5 v9 z" fill="#c3c2b7"/><rect x="276" y="20" width="330" height="344" rx="10" fill="none" stroke="#3987e5" stroke-width="1.5"/><text x="441" y="48" text-anchor="middle" font-size="15" font-weight="700" fill="#f0efec">nexus-cli</text><text x="441" y="67" text-anchor="middle" font-size="12" fill="#c3c2b7">one command tree, 22 service commands</text><rect x="294" y="84" width="294" height="46" rx="8" fill="#242423" stroke="#3a3a37"/><text x="441" y="104" text-anchor="middle" font-size="14" font-weight="600" fill="#f0efec">Profiles</text><text x="441" y="122" text-anchor="middle" font-size="12" fill="#c3c2b7">several servers, isolated settings</text><rect x="294" y="138" width="294" height="46" rx="8" fill="#242423" stroke="#3a3a37"/><text x="441" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#f0efec">Secret store</text><text x="441" y="176" text-anchor="middle" font-size="12" fill="#c3c2b7">credentials never in arguments</text><rect x="294" y="192" width="294" height="46" rx="8" fill="#3987e5" stroke="#3987e5"/><text x="441" y="212" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Permission gate</text><text x="441" y="230" text-anchor="middle" font-size="12" fill="#0b0b0b" opacity="0.9">ReadOnly on · Update off until granted</text><rect x="294" y="246" width="294" height="46" rx="8" fill="#242423" stroke="#3a3a37"/><text x="441" y="266" text-anchor="middle" font-size="14" font-weight="600" fill="#f0efec">Bounded transfers</text><text x="441" y="284" text-anchor="middle" font-size="12" fill="#c3c2b7">page and byte limits, SHA256 check</text><rect x="294" y="300" width="294" height="46" rx="8" fill="#242423" stroke="#3a3a37"/><text x="441" y="320" text-anchor="middle" font-size="14" font-weight="600" fill="#f0efec">Error scrubbing</text><text x="441" y="338" text-anchor="middle" font-size="12" fill="#c3c2b7">no response bodies or credentials</text><rect x="676" y="137" width="188" height="110" rx="8" fill="#242423" stroke="#3a3a37"/><text x="770" y="189" text-anchor="middle" font-size="14" font-weight="600" fill="#f0efec">Nexus Repository API</text><text x="770" y="207" text-anchor="middle" font-size="12" fill="#c3c2b7">20 of 442 REST operations</text><path d="M606 192 C641 192 641 192 669 192" fill="none" stroke="#c3c2b7" stroke-width="1.5"/><path d="M676 192 l-8 -4.5 v9 z" fill="#c3c2b7"/></svg>
